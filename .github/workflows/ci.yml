name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libosmesa6
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -m "not physics"
      - run: pytest -m physics
        env:
          MUJOCO_GL: osmesa
