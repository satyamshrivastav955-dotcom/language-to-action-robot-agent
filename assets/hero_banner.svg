<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="neonGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 15px rgba(0,212,255,0.4)); }
      50% { opacity: 0.95; filter: drop-shadow(0 0 25px rgba(0,212,255,0.8)); }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(400px); opacity: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
    }
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes beamSweep {
      0% { x1: -100; x2: 0; }
      100% { x1: 1200; x2: 1300; }
    }
    .pulse-text { animation: pulseGlow 4s ease-in-out infinite; }
    .floating-p1 { animation: floatParticle 6s ease-in-out infinite; }
    .floating-p2 { animation: floatParticle 8s ease-in-out infinite 1.5s; }
    .floating-p3 { animation: floatParticle 7s ease-in-out infinite 3s; }
  </style>

  <!-- Background Card -->
  <rect width="1196" height="376" x="2" y="2" rx="16" fill="url(#bgGradient)"/>
  <rect width="1196" height="376" x="2" y="2" rx="16" fill="url(#grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="140" fill="#00d4ff" opacity="0.07" filter="url(#glow)"/>
  <circle cx="1000" cy="280" r="160" fill="#7928ca" opacity="0.08" filter="url(#glow)"/>
  <circle cx="600" cy="190" r="220" fill="#00ff88" opacity="0.04" filter="url(#glow)"/>

  <!-- Floating Tech Particles -->
  <circle class="floating-p1" cx="150" cy="280" r="2" fill="#00d4ff"/>
  <circle class="floating-p2" cx="950" cy="90" r="2.5" fill="#00ff88"/>
  <circle class="floating-p3" cx="1080" cy="220" r="2" fill="#ff0080"/>
  <circle class="floating-p1" cx="320" cy="60" r="1.5" fill="#3b82f6"/>

  <!-- Border Outline with Gradient -->
  <rect width="1196" height="376" x="2" y="2" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Status Bar Pill -->
  <g transform="translate(60, 42)">
    <rect width="360" height="32" rx="16" fill="url(#badgeGrad)" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="18" cy="16" r="5" fill="#00ff88">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#00d4ff" letter-spacing="1.5">AUTONOMOUS EMBODIED ROBOTICS</text>
  </g>

  <!-- GitHub Stars / Portfolio Tag Pill (Right) -->
  <g transform="translate(840, 42)">
    <rect width="300" height="32" rx="16" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="24" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#9ca3af">PHYSICS-GROUNDED AGENT</text>
    <rect x="235" y="8" width="50" height="16" rx="8" fill="#00ff88" fill-opacity="0.2"/>
    <text x="244" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" fill="#00ff88">v2.4</text>
  </g>

  <!-- Central Title & Brand -->
  <g transform="translate(60, 150)">
    <!-- Icon Symbol -->
    <g transform="translate(0, -35)">
      <rect width="72" height="72" rx="16" fill="#0e1726" stroke="#00d4ff" stroke-width="1.5" filter="url(#softGlow)"/>
      <path d="M 22 36 L 50 36 M 36 22 L 36 50 M 26 26 L 46 46 M 26 46 L 46 26" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="36" cy="36" r="6" fill="#00ff88"/>
    </g>

    <!-- Main Title -->
    <text x="92" y="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      NEXUS-1 <tspan fill="url(#cyanBlueGrad)">ROBOT TASK AGENT</tspan>
    </text>

    <!-- Subtitle / Elevator Hook -->
    <text x="94" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Closed-Loop Hierarchical Embodied AI &bull; Local LLM Planning &bull; 6-DOF DLS Kinematics &bull; MuJoCo Physics Verification
    </text>
  </g>

  <!-- Bottom Capability Chips -->
  <g transform="translate(60, 260)">
    <!-- Chip 1: Local LLMs -->
    <g transform="translate(0, 0)">
      <rect width="250" height="60" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="14" y="14" width="32" height="32" rx="8" fill="#00d4ff" fill-opacity="0.1"/>
      <text x="24" y="35" font-family="sans-serif" font-size="16">🧠</text>
      <text x="56" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">100% Offline LLMs</text>
      <text x="56" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Ollama Qwen2.5 / Llama3.1</text>
    </g>

    <!-- Chip 2: MuJoCo Physics Ground Truth -->
    <g transform="translate(270, 0)">
      <rect width="260" height="60" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="14" y="14" width="32" height="32" rx="8" fill="#00ff88" fill-opacity="0.1"/>
      <text x="24" y="35" font-family="sans-serif" font-size="16">⚡</text>
      <text x="56" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Tier-A Physics Verifier</text>
      <text x="56" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Direct mjData State Probing</text>
    </g>

    <!-- Chip 3: Error Recovery Loop -->
    <g transform="translate(550, 0)">
      <rect width="260" height="60" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="14" y="14" width="32" height="32" rx="8" fill="#a855f7" fill-opacity="0.1"/>
      <text x="24" y="35" font-family="sans-serif" font-size="16">🎯</text>
      <text x="56" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Adaptive Miss Recovery</text>
      <text x="56" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Δp Metric Vector Correction</text>
    </g>

    <!-- Chip 4: State Persistence -->
    <g transform="translate(830, 0)">
      <rect width="250" height="60" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="14" y="14" width="32" height="32" rx="8" fill="#f59e0b" fill-opacity="0.1"/>
      <text x="24" y="35" font-family="sans-serif" font-size="16">🔄</text>
      <text x="56" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">State Persistence</text>
      <text x="56" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Multi-Step Object Comp.</text>
    </g>
  </g>
</svg>
