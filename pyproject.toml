[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "language-to-action-robot-agent"
version = "0.2.0"
description = "Closed-loop language-to-action manipulation agent with a physical-outcome verifier"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "mujoco>=3.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
dashboard = ["gradio>=6.0"]
bedrock = ["boto3"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
robot-agent = "run_agent:cli"

[tool.setuptools]
py-modules = ["run_agent", "app"]

[tool.setuptools.packages.find]
include = ["agent*", "env*", "configs*", "dashboard*", "bench*", "perception*", "tools*", "adapters*"]

[tool.setuptools.package-data]
env = ["scene.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["physics: runs the MuJoCo simulation (slow)"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E9", "F"]
